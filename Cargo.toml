[workspace]
resolver = "2"
members = [
    "crates/bff",
    "crates/auth-identity-service",
    "crates/content-vocabulary-service",
    "crates/phonetic-audio-service",
    "crates/ai-evaluator-service",
    "crates/srs-engine-service",
    "crates/gamification-progress-service",
    "crates/proto",
    "crates/common",
]

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros", "ws"] }
tonic = { version = "0.12", default-features = false, features = ["transport", "prost", "codegen"] }
prost = "0.13"
tonic-build = "0.12"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
fred = { version = "9.0", default-features = false, features = ["tokio-rustls", "serde-json", "transactions"] }
async-nats = "0.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
argon2 = "0.5"
jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "1.0"
anyhow = "1.0"
proptest = "1.4"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-polly = "1"
aws-sdk-transcribestreaming = "1"
aws-sdk-bedrockruntime = "1"
base64 = "0.22"
futures = "0.3"
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
