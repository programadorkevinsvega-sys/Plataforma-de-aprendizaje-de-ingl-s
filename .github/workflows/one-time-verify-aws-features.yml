name: One-time verify AWS legacy transport features

on:
  push:
    branches:
      - 'fix/aws-sdk-legacy-tls-feature'

permissions:
  contents: read

jobs:
  verify-feature-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify legacy vulnerable transports are not active
        run: |
          set -euo pipefail
          cargo tree -e features -i h2@0.3.27 --target x86_64-unknown-linux-gnu || true
          cargo tree -e features -i rustls@0.21.12 --target x86_64-unknown-linux-gnu || true
          cargo tree -e features -i rustls-webpki@0.101.7 --target x86_64-unknown-linux-gnu || true
          cargo tree -e features -i aws-smithy-http-client@1.5.2 --target x86_64-unknown-linux-gnu
