name: One-time Cargo lockfile reconciliation

on:
  push:
    branches:
      - 'fix/cargo-lock-ci'

permissions:
  contents: write

jobs:
  reconcile-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lockfile repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Resolve workspace metadata and reconcile Cargo.lock
        run: cargo metadata --format-version 1 > /dev/null
      - name: Commit lockfile update only when needed
        run: |
          git diff -- Cargo.lock
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "fix(rust): reconcile workspace Cargo.lock"
          git push origin "HEAD:${{ github.ref_name }}"
