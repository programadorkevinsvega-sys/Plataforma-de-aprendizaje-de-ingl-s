name: Temporary Cargo lock regeneration

on:
  push:
    branches:
      - feat/phase-1.4-catalog-curation-audit
    paths:
      - .github/workflows/cargo-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Resolve and commit workspace lockfile
        run: |
          set -euo pipefail
          cargo tree --workspace --all-targets --target x86_64-unknown-linux-gnu
          git diff -- Cargo.lock
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "::error::Cargo resolution did not change Cargo.lock."
            exit 1
          fi
          if [[ -n "$(git status --short | grep -v '^M  Cargo.lock$' || true)" ]]; then
            echo "::error::Unexpected files changed while resolving dependencies."
            git status --short
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): regenerate Cargo.lock for workspace targets"
          git push origin HEAD:refs/heads/feat/phase-1.4-catalog-curation-audit
