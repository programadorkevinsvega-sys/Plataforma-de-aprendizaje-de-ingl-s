name: One-time lockfile reconcile after AWS feature change

on:
  push:
    branches:
      - 'fix/aws-sdk-legacy-tls-feature'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Re-resolve Cargo.lock after feature changes
        run: cargo update
      - name: Commit lockfile update
        run: |
          git diff --stat -- Cargo.lock
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock did not change; the workflow is unnecessary."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "fix(deps): refresh Cargo.lock after AWS transport feature change"
          git push origin "HEAD:${{ github.ref_name }}"
