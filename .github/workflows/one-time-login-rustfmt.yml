name: One-time Rust formatting for auth integration test

on:
  push:
    branches:
      - 'fix/login-enumeration-status'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install stable Rust and rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatting changes
        run: |
          if git diff --quiet -- '*.rs'; then
            echo "Rust files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style(rust): format login enumeration integration test"
          git push origin "HEAD:${{ github.ref_name }}"
