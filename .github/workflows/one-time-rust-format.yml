name: One-time Rust formatting

on:
  push:
    branches:
      - 'fix/rust-formatting-ci'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout formatting branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Install stable Rust with rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Apply workspace formatting
        run: cargo fmt --all
      - name: Commit formatting changes only when needed
        run: |
          if git diff --quiet --; then
            echo "Rust workspace already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style(rust): apply rustfmt across workspace"
          git push origin "HEAD:${{ github.ref_name }}"
