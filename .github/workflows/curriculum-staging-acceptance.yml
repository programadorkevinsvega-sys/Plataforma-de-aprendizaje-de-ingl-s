name: Curriculum staging admin acceptance

on:
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: "Confirm that the isolated staging environment may receive a published acceptance fixture"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: curriculum-staging-admin-acceptance
  cancel-in-progress: false

jobs:
  guard:
    name: Require an explicit staging run from main
    runs-on: ubuntu-24.04
    steps:
      - name: Validate branch and explicit confirmation
        env:
          RUN_REF: ${{ github.ref }}
          CONFIRM_STAGING: ${{ inputs.confirm_staging }}
        run: |
          set -euo pipefail
          if [[ "$RUN_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from main only."
            exit 1
          fi
          if [[ "$CONFIRM_STAGING" != "true" ]]; then
            echo "::error::Explicit staging confirmation is required."
            exit 1
          fi

  accept:
    name: Run real editorial acceptance against staging
    needs: guard
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CURRICULUM_ACCEPTANCE_ENV: staging
      CURRICULUM_API_BASE_URL: ${{ vars.CURRICULUM_API_BASE_URL }}
      CURRICULUM_EDITOR_EMAIL: ${{ vars.CURRICULUM_EDITOR_EMAIL }}
      CURRICULUM_EDITOR_PASSWORD: ${{ secrets.CURRICULUM_EDITOR_PASSWORD }}
      CURRICULUM_NON_EDITOR_EMAIL: ${{ vars.CURRICULUM_NON_EDITOR_EMAIL }}
      CURRICULUM_NON_EDITOR_PASSWORD: ${{ secrets.CURRICULUM_NON_EDITOR_PASSWORD }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Node.js 26
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          version: 12.21.0
          runtime: node@26.13.1
          cache: false
          install: false

      - name: Validate staging configuration and execute live acceptance
        run: |
          set -euo pipefail
          for name in \
            CURRICULUM_API_BASE_URL \
            CURRICULUM_EDITOR_EMAIL \
            CURRICULUM_EDITOR_PASSWORD \
            CURRICULUM_NON_EDITOR_EMAIL \
            CURRICULUM_NON_EDITOR_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is missing from GitHub Environment staging."
              exit 1
            fi
          done

          if [[ "$CURRICULUM_EDITOR_EMAIL" == "$CURRICULUM_NON_EDITOR_EMAIL" ]]; then
            echo "::error::The editor and non-editor accounts must be different users."
            exit 1
          fi

          node tools/curriculum/acceptance-smoke.mjs
