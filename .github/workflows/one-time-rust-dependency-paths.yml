name: One-time Rust dependency paths

on:
  push:
    branches:
      - 'fix/rust-security-dependencies'

permissions:
  contents: read

jobs:
  dependency-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Print reverse dependency trees for remaining advisories
        run: |
          cargo tree -i h2@0.3.27 || true
          cargo tree -i rsa@0.9.10 || true
          cargo tree -i rustls@0.21.12 || true
          cargo tree -i rustls-webpki@0.101.7 || true
