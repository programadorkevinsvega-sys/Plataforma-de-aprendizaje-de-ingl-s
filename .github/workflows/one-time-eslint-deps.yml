name: One-time frontend ESLint dependency setup

on:
  push:
    branches:
      - 'fix/frontend-eslint-ci'

permissions:
  contents: write

jobs:
  install-eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Add locked ESLint tooling
        working-directory: frontend
        run: npm install --save-dev eslint@8.57.1 eslint-config-next@15.5.22 --no-audit
      - name: Commit generated manifests
        run: |
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Manifest files did not change."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(frontend): declare ESLint and Next.js config dependencies"
          git push origin "HEAD:${{ github.ref_name }}"
