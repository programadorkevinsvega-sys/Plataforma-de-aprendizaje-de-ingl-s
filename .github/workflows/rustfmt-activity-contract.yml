name: Format activity contract source

on:
  pull_request:
    paths:
      - 'crates/common/src/activity_contract.rs'
      - '.github/workflows/rustfmt-activity-contract.yml'

permissions:
  contents: read

jobs:
  format:
    name: Generate rustfmt-normalized activity contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Format activity contract
        run: rustfmt --edition 2021 crates/common/src/activity_contract.rs
      - name: Upload formatted source for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: activity-contract-rustfmt
          path: crates/common/src/activity_contract.rs
          if-no-files-found: error
          retention-days: 2
