name: Run full activity contract CI

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/activity-ci-dispatch.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    name: Dispatch CI for current PR head
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Remove dispatcher and run full CI on the final head
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git rm .github/workflows/activity-ci-dispatch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): remove one-shot activity dispatcher"
          git push origin "HEAD:$HEAD_BRANCH"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -d '{"ref":"'"$HEAD_BRANCH"'"}'
