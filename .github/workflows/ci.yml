name: CI

on:
  # Stacked security PRs use another feature branch as their base; run the same
  # checks for every pull request, not only PRs whose base is main.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust format, lint, build, and tests
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/devfluency_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devfluency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devfluency_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install PostgreSQL client and Protocol Buffers compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client protobuf-compiler
          protoc --version
      - name: Apply database migrations for integration tests
        run: |
          for migration in migrations/*.sql; do
            echo "Applying $migration"
            psql "$TEST_DATABASE_URL" --set ON_ERROR_STOP=1 --file "$migration"
          done
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile workspace
        run: cargo check --workspace --all-targets --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace --locked

  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BFF_URL: https://app-ingles.jnmtortas.com
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        if: always()
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build production bundle
        run: npm run build

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate deployment shell scripts
        run: bash -n deploy/bootstrap-ubuntu.sh deploy/deploy-release.sh
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Verify ignored RustSec packages are inactive
        run: |
          set -euo pipefail
          cargo tree --locked --workspace --all-targets --target x86_64-unknown-linux-gnu > /tmp/devfluency-active-dependencies.txt
          if grep -E 'h2 v0\.3\.27|rustls v0\.21\.12|rustls-webpki v0\.101\.7|rsa v0\.9\.10' /tmp/devfluency-active-dependencies.txt; then
            echo "::error::An exception-listed vulnerable crate re-entered the active workspace dependency graph."
            exit 1
          fi
      - name: Audit Rust dependencies
        run: |
          # cargo-audit 0.22.x no admite --locked; audita el Cargo.lock versionado.
          # .cargo/audit.toml documents only inactive optional dependency advisories.
          git diff --exit-code -- Cargo.lock
          cargo audit
          git diff --exit-code -- Cargo.lock
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit frontend dependencies
        if: always()
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high
