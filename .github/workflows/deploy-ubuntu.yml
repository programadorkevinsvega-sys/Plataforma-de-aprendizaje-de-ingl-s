# Changes to this deployment workflow are classified as deploy-required in ci.yml,
# so pipeline fixes are exercised through the automatic production release path.
name: Deploy Ubuntu (systemd)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full commit SHA with successful CI on main and run_deploy=true"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  detect-deployable-changes:
    name: Detect deployable changes
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-24.04
    outputs:
      deploy_required: ${{ steps.classify.outputs.deploy_required }}
    steps:
      - name: Find successful push CI run for the exact manual deployment SHA
        id: select-ci
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Manual deployment requires a full 40-character commit SHA."
            exit 1
          fi
          runs_url="$GH_API_URL/repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&per_page=100"
          runs_json="$(curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$runs_url")"
          ci_run_id="$(jq -r --arg sha "$RELEASE_SHA" '
            [.workflow_runs[]
              | select(.head_sha == $sha)
              | select(.event == "push")
              | select(.head_branch == "main")
              | select(.conclusion == "success")]
            | sort_by(.run_number)
            | last
            | .id // empty
          ' <<< "$runs_json")"

          if [[ -z "$ci_run_id" ]]; then
            echo "::error::Manual deployment refused: no successful CI push run exists for exact SHA $RELEASE_SHA on main."
            exit 1
          fi

          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"
          echo "Manual retry will reuse successful CI run $ci_run_id for $RELEASE_SHA."

      - name: Download change classification from the exact successful CI run
        uses: actions/download-artifact@v4
        with:
          name: ci-change-metadata
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || steps.select-ci.outputs.ci_run_id }}

      - name: Read deployment decision
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.event.inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ ! -s ci-change-metadata.txt ]]; then
            echo "::error::The successful CI run did not provide change metadata; refusing to guess deployment scope."
            exit 1
          fi

          metadata_head="$(sed -n 's/^head_sha=//p' ci-change-metadata.txt)"
          if [[ "$metadata_head" != "$RELEASE_SHA" ]]; then
            echo "::error::CI metadata does not match the commit requested for deployment."
            exit 1
          fi

          deploy_required="$(sed -n 's/^run_deploy=//p' ci-change-metadata.txt)"
          if [[ "$deploy_required" != "true" && "$deploy_required" != "false" ]]; then
            echo "::error::Invalid deploy_required value in CI metadata."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$deploy_required" != "true" ]]; then
            echo "::error::Manual deployment refused: the successful CI classification for this SHA did not mark it as deployable."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual retry authorized by successful CI for exact SHA $RELEASE_SHA."
          fi

          echo "deploy_required=$deploy_required" >> "$GITHUB_OUTPUT"
          echo "Production deployment required: $deploy_required"

  build:
    name: Build production release
    environment: production
    needs: detect-deployable-changes
    if: ${{ needs.detect-deployable-changes.outputs.deploy_required == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact commit validated by CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.release_sha || github.sha }}

      - name: Validate deployment scripts and health-check helpers
        run: |
          set -euo pipefail
          bash -n deploy/deploy-release.sh
          bash -n deploy/lib/health-checks.sh
          bash deploy/tests/test-health-checks.sh
          test -n "$(find migrations -maxdepth 1 -type f -name '*.sql' -print -quit)"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install SQLx migration CLI
        run: |
          cargo install sqlx-cli --version 0.8.6 --no-default-features --features rustls,postgres --locked
          sqlx --version

      - name: Build all Rust production executables
        run: cargo build --workspace --release --locked

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build standalone frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_BFF_URL: ${{ vars.NEXT_PUBLIC_BFF_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${NEXT_PUBLIC_BFF_URL:-}" ]]; then
            echo "::error::Configure the repository variable NEXT_PUBLIC_BFF_URL=https://app-ingles.jnmtortas.com before building the production frontend."
            exit 1
          fi
          if [[ "$NEXT_PUBLIC_BFF_URL" != "https://app-ingles.jnmtortas.com" ]]; then
            echo "::error::NEXT_PUBLIC_BFF_URL must match the production application origin."
            exit 1
          fi
          printf 'NEXT_PUBLIC_BFF_URL=%s\n' "$NEXT_PUBLIC_BFF_URL" > .env.production
          npm ci
          npm run build
          if grep -R -n -F 'http://localhost:8080' .next/static .next/server; then
            echo "::error::The production frontend bundle still contains the localhost BFF URL; offending files and lines are listed above."
            exit 1
          fi

      - name: Assemble deployment package
        run: |
          set -euo pipefail
          mkdir -p dist/bin dist/frontend dist/deploy
          for binary in bff auth-identity-service content-vocabulary-service ai-evaluator-service phonetic-audio-service srs-engine-service gamification-progress-service; do
            install -m 0755 "target/release/$binary" "dist/bin/$binary"
          done
          install -m 0755 "$(command -v sqlx)" dist/bin/sqlx
          install -m 0755 target/release/tts-smoke-test dist/bin/tts-smoke-test
          cp -a frontend/.next/standalone/. dist/frontend/
          mkdir -p dist/frontend/.next
          cp -a frontend/.next/static dist/frontend/.next/static
          if [ -d frontend/public ]; then cp -a frontend/public dist/frontend/public; fi
          cp -a deploy/. dist/deploy/
          cp -a migrations dist/migrations
          tar -czf devfluency-deploy-package.tar.gz -C dist bin frontend deploy migrations
          sha256sum devfluency-deploy-package.tar.gz | awk '{print $1}' > devfluency-deploy-package.tar.gz.sha256
          test "$(wc -c < devfluency-deploy-package.tar.gz.sha256)" -eq 65
          echo "Deployment package SHA-256: $(cat devfluency-deploy-package.tar.gz.sha256)"

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: devfluency-release
          path: |
            devfluency-deploy-package.tar.gz
            devfluency-deploy-package.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Activate production release
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: devfluency-release

      - name: Verify deployment package checksum before transfer
        run: |
          set -euo pipefail
          expected="$(cat devfluency-deploy-package.tar.gz.sha256)"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$expected" "devfluency-deploy-package.tar.gz" | sha256sum --check

      - name: Validate Tailscale credential is configured
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [[ -z "$TAILSCALE_AUTHKEY" ]]; then
            echo "::error::TAILSCALE_AUTHKEY is empty or unavailable to the production environment. Configure it under Settings > Environments > production > Environment secrets."
            exit 1
          fi

      - name: Connect runner to private tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Transfer and activate release on private Ubuntu VM
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.event.inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
          package="devfluency-${RELEASE_SHA}.tar.gz"
          checksum="devfluency-deploy-package.tar.gz.sha256"
          scp -o BatchMode=yes devfluency-deploy-package.tar.gz \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/$package"
          scp -o BatchMode=yes devfluency-deploy-package.tar.gz.sha256 \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/$checksum"
          ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail; package=/tmp/$package; checksum=/tmp/$checksum; expected=\$(cat \"\$checksum\"); [[ \"\$expected\" =~ ^[0-9a-f]{64}$ ]]; printf '%s  %s\\n' \"\$expected\" \"\$package\" | sha256sum --check; stage=/tmp/devfluency-${RELEASE_SHA}; mkdir -p \"\$stage\"; tar -xzf \"\$package\" -C \"\$stage\"; sudo bash \"\$stage/deploy/bootstrap-ubuntu.sh\"; tar -czf \"\$stage/release.tar.gz\" -C \"\$stage\" bin frontend migrations; sudo bash \"\$stage/deploy/deploy-release.sh\" '${RELEASE_SHA}' \"\$stage/release.tar.gz\"; rm -rf \"\$stage\" \"\$package\" \"\$checksum\""
