name: One-time Next.js 16 security upgrade

on:
  push:
    branches:
      - 'fix/next-16-security-upgrade'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install reproducible baseline
        working-directory: frontend
        run: npm ci
      - name: Upgrade Next.js and matching ESLint config to security-fixed release
        working-directory: frontend
        run: npm install next@16.4.3 eslint-config-next@16.4.3 --no-audit
      - name: Capture audit results without masking them
        working-directory: frontend
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))},null,2))"
      - name: Commit manifest and lockfile changes
        run: |
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "The Next.js security upgrade produced no manifest changes."
            exit 1
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): upgrade Next.js to security-fixed v16"
          git push origin "HEAD:${{ github.ref_name }}"
