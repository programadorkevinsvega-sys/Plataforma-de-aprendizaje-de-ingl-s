syntax = "proto3";

package content;

service ContentService {
  rpc GetVocabularyWord (GetVocabularyWordRequest) returns (VocabularyWordResponse);
  rpc ListVocabularyWords (ListVocabularyWordsRequest) returns (ListVocabularyWordsResponse);
  rpc GetRandomInterviewQuestion (GetRandomInterviewQuestionRequest) returns (InterviewQuestionResponse);
  rpc ListCurriculumCourses (ListCurriculumCoursesRequest) returns (ListCurriculumCoursesResponse);
  rpc GetCurriculumCourse (GetCurriculumCourseRequest) returns (GetCurriculumCourseResponse);
  rpc EnrollInCourse (EnrollInCourseRequest) returns (EnrollInCourseResponse);
  rpc RecordCurriculumLessonEvidence (RecordCurriculumLessonEvidenceRequest) returns (RecordCurriculumLessonEvidenceResponse);
  rpc ListEditorialCourseVersions (ListEditorialCourseVersionsRequest) returns (ListEditorialCourseVersionsResponse);
  rpc ApplyEditorialAction (ApplyEditorialActionRequest) returns (ApplyEditorialActionResponse);
}

message ContextSentence {
  string id = 1;
  string english_text = 2;
  string spanish_phonetic = 3;
  string spanish_translation = 4;
  string audio_url = 5;
  string spanish_phonetic_natural = 6;
}

message VocabularyWordResponse {
  string id = 1;
  string word = 2;
  string spanish_phonetic = 3;
  string spanish_translation = 4;
  string category = 5;
  string level = 6;
  repeated ContextSentence context_sentences = 7;
  string spanish_phonetic_natural = 8;
}

message GetVocabularyWordRequest {
  string word_id = 1;
}

message ListVocabularyWordsRequest {
  string level = 1;
  string category = 2;
  int32 limit = 3;
  int32 offset = 4;
  string user_id = 5;
}

message ListVocabularyWordsResponse {
  repeated VocabularyWordResponse words = 1;
  int32 total = 2;
}

message GetRandomInterviewQuestionRequest {
  string category = 1;
  string level = 2;
}

message InterviewQuestionResponse {
  string id = 1;
  string question = 2;
  string category = 3;
  string difficulty = 4;
}

message ListCurriculumCoursesRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  string track_code = 4;
  string cefr_level = 5;
  string search = 6;
}

message ListCurriculumCoursesResponse {
  repeated CurriculumCourseSummary items = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message GetCurriculumCourseRequest {
  string user_id = 1;
  string course_version_id = 2;
}

message GetCurriculumCourseResponse {
  CurriculumCourseSummary course = 1;
  repeated CurriculumUnit units = 2;
}

message CurriculumCourseSummary {
  string course_version_id = 1;
  string slug = 2;
  string track_code = 3;
  string cefr_level = 4;
  int32 version_number = 5;
  string title = 6;
  string description = 7;
  int32 unit_count = 8;
  int32 lesson_count = 9;
  int32 estimated_minutes = 10;
  bool enrolled = 11;
  string status = 12;
}

message CurriculumUnit {
  string id = 1;
  int32 position = 2;
  string title = 3;
  string theme = 4;
  string description = 5;
  int32 estimated_minutes = 6;
  repeated CurriculumLesson lessons = 7;
}

message CurriculumLesson {
  string id = 1;
  string lesson_code = 2;
  int32 position = 3;
  string lesson_pattern = 4;
  string title = 5;
  string description = 6;
  int32 estimated_minutes = 7;
  repeated CurriculumObjective objectives = 8;
  repeated CurriculumPrerequisite prerequisites = 9;
  string progress_state = 10;
  bool unlocked = 11;
  double mastery_score = 12;
}

message CurriculumObjective {
  string id = 1;
  string objective_code = 2;
  string description = 3;
  string success_criteria = 4;
  int32 position = 5;
  bool required = 6;
  repeated string skills = 7;
}

message CurriculumPrerequisite {
  string prerequisite_lesson_id = 1;
  string required_state = 2;
  double minimum_mastery_score = 3;
}

message EnrollInCourseRequest {
  string user_id = 1;
  string course_version_id = 2;
}

message EnrollInCourseResponse {
  string enrollment_id = 1;
  string course_version_id = 2;
  string status = 3;
  string started_at = 4;
}

message RecordCurriculumLessonEvidenceRequest {
  string user_id = 1;
  string lesson_id = 2;
  string evidence_event_id = 3;
  double mastery_score = 4;
}

message RecordCurriculumLessonEvidenceResponse {
  bool applied = 1;
  string progress_state = 2;
  double mastery_score = 3;
}

message ListEditorialCourseVersionsRequest {
  string user_id = 1;
  string status = 2;
}
message EditorialCourseVersion {
  string course_version_id = 1;
  string slug = 2;
  string track_code = 3;
  string cefr_level = 4;
  int32 version_number = 5;
  string title = 6;
  string description = 7;
  string status = 8;
  string submitted_at = 9;
  string published_at = 10;
  string latest_decision = 11;
  string latest_comments = 12;
}
message ListEditorialCourseVersionsResponse {
  repeated EditorialCourseVersion items = 1;
}
message ApplyEditorialActionRequest {
  string user_id = 1;
  string course_version_id = 2;
  string action = 3;
  string decision = 4;
  string comments = 5;
}
message ApplyEditorialActionResponse {
  string course_version_id = 1;
  string action = 2;
  string status = 3;
  string decision = 4;
  bool applied = 5;
}
