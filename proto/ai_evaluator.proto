syntax = "proto3";

package ai_evaluator;

service AIEvaluatorService {
  rpc EvaluateExamAnswer (EvaluateExamAnswerRequest) returns (EvaluateExamAnswerResponse);
  rpc EvaluateLearningActivity (EvaluateLearningActivityRequest) returns (EvaluateLearningActivityResponse);
  rpc StartLessonSession (StartLessonSessionRequest) returns (StartLessonSessionResponse);
  rpc GetLessonSession (GetLessonSessionRequest) returns (GetLessonSessionResponse);
  rpc BeginLessonActivityAttempt (BeginLessonActivityAttemptRequest) returns (BeginLessonActivityAttemptResponse);
  rpc CommitLessonActivityAttempt (CommitLessonActivityAttemptRequest) returns (CommitLessonActivityAttemptResponse);
  rpc RevealLessonActivityHint (RevealLessonActivityHintRequest) returns (RevealLessonActivityHintResponse);
  rpc GenerateTargetedDrill (GenerateTargetedDrillRequest) returns (GenerateTargetedDrillResponse);
}

message EvaluateExamAnswerRequest {
  string user_id = 1;
  string question_id = 2;
  string user_text_response = 3;
  string target_level = 4;
}

message DetectedWeakness {
  string skill = 1;
  float score = 2;
  string tip = 3;
}

message EvaluateExamAnswerResponse {
  float score_listening = 1;
  float score_pronunciation = 2;
  float score_fluency = 3;
  float score_vocabulary = 4;
  float score_grammar = 5;
  float score_conversation = 6;
  float total_score = 7;
  bool passed = 8;
  repeated DetectedWeakness detected_weaknesses = 9;
}

message EvaluateLearningActivityRequest {
  string user_id = 1;
  string activity_definition_json = 2;
  string submission_json = 3;
}

message EvaluateLearningActivityResponse {
  string result_json = 1;
  bool idempotent_replay = 2;
}

message StartLessonSessionRequest {
  string user_id = 1;
  string lesson_id = 2;
  string idempotency_key = 3;
}

message StartLessonSessionResponse {
  LessonSessionSnapshot session = 1;
  bool resumed_existing = 2;
}

message GetLessonSessionRequest {
  string user_id = 1;
  string session_id = 2;
}

message GetLessonSessionResponse {
  LessonSessionSnapshot session = 1;
}

message BeginLessonActivityAttemptRequest {
  string user_id = 1;
  string session_id = 2;
  string submission_json = 3;
}

message BeginLessonActivityAttemptResponse {
  string reservation_id = 1;
  string activity_definition_json = 2;
  string existing_result_json = 3;
  bool idempotent_replay = 4;
}

message CommitLessonActivityAttemptRequest {
  string user_id = 1;
  string session_id = 2;
  string reservation_id = 3;
}

message CommitLessonActivityAttemptResponse {
  string result_json = 1;
  LessonSessionSnapshot session = 2;
  bool idempotent_replay = 3;
}

message RevealLessonActivityHintRequest {
  string user_id = 1;
  string session_id = 2;
  int32 hint_order = 3;
}

message RevealLessonActivityHintResponse {
  string hint_id = 1;
  int32 hint_order = 2;
  string title = 3;
  string body = 4;
}

message LessonSessionSnapshot {
  string session_id = 1;
  string lesson_id = 2;
  string lesson_title = 3;
  string course_version_id = 4;
  string status = 5;
  int32 current_activity_position = 6;
  int32 total_activities = 7;
  int64 active_duration_ms = 8;
  string student_activity_json = 9;
  // Private RPC field: the BFF uses it for evaluation and must never serialize it to HTTP.
  string activity_definition_json = 10;
  string last_result_json = 11;
  string completed_at = 12;
  int32 remaining_attempts = 13;
  // Private recovery fields; the BFF consumes these and never serializes them to HTTP.
  string pending_reservation_id = 14;
  string pending_submission_json = 15;
  // User-owned hints explicitly revealed for the current activity.
  string revealed_hints_json = 16;
}

message GenerateTargetedDrillRequest {
  string user_id = 1;
  repeated string weak_skills = 2;
}

message DrillExercise {
  string title = 1;
  string english_text = 2;
  string spanish_phonetic = 3;
  string target_skill = 4;
}

message GenerateTargetedDrillResponse {
  string drill_id = 1;
  int32 duration_minutes = 2;
  repeated DrillExercise exercises = 3;
}
