version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: devfluency_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Kevins1612522026
      POSTGRES_DB: devfluency_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/20260805000000_init_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devfluency_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: devfluency_redis
    command: redis-server --requirepass Kevins1612522026
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Kevins1612522026", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: devfluency_nats
    command: "-js --user nats_admin --pass Kevins1612522026"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data

volumes:
  postgres_data:
  redis_data:
  nats_data:
