[Service]
# Run the audio/TTS microservice under its own Unix identity.
User=devfluency-audio
Group=devfluency
ReadWritePaths=
ReadWritePaths=/var/lib/devfluency-audio
# Only this microservice receives the Cloudflare API credential.
EnvironmentFile=/etc/apps/plataforma-aprendizaje/phonetic-audio-service.secrets
